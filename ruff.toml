# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Pulpit supports Python 3.12–3.14; target the floor so lint and formatting stay valid across the range.
target-version = "py312"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F", "B", "I", "DJ", "C4", "ICN", "Q", "NPY", "FLY"]  # and soon ... + ["A", "DTZ", "PL", "FURB"]
ignore = ["F405", ]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "lf"


# Ruff's default conventional aliases, minus `datetime = "dt"` (added to the defaults in ruff 0.17): the
# codebase imports the `datetime` module unaliased, and `dt` is used as a local name in places. Setting
# `aliases` replaces the default table, so keep it in step with `ruff config lint.flake8-import-conventions.aliases`.
[lint.flake8-import-conventions.aliases]
altair = "alt"
matplotlib = "mpl"
"matplotlib.pyplot" = "plt"
networkx = "nx"
numpy = "np"
"numpy.typing" = "npt"
pandas = "pd"
seaborn = "sns"
tensorflow = "tf"
tkinter = "tk"
holoviews = "hv"
panel = "pn"
"plotly.express" = "px"
polars = "pl"
pyarrow = "pa"
"xml.etree.ElementTree" = "ET"

[lint.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "django", "first-party", "local-folder", "third-party"]

[lint.isort.sections]
"django" = ["django"]

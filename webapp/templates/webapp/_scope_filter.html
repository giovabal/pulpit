{% comment %}
The "Scope" menu of the home and Audience pages: a container-group label (?filter=<label id>, e.g.
Continents → Europe) limits the page to the channels under it. Keeps every other query parameter
(search, message options) and drops the page number. Needs ``container_groups`` and ``filter_voice``.
{% endcomment %}
{% if container_groups %}
<form method="get" action="" class="home-filter-bar">
  {# Keep every other query param (search, message options) while switching scope; drop the page. #}
  {% for key, values in request.GET.lists %}{% if key != "filter" and key != "page" %}{% for value in values %}
  <input type="hidden" name="{{ key }}" value="{{ value }}">
  {% endfor %}{% endif %}{% endfor %}
  <label class="home-filter-label" for="scope-filter-select">
    <i class="bi bi-funnel" aria-hidden="true"></i>Scope
  </label>
  <select id="scope-filter-select" name="filter" class="home-filter-select" onchange="this.form.submit()">
    <option value="">All channels</option>
    {% for group in container_groups %}
    <optgroup label="{{ group.name }}">
      {% for voice in group.labels.all %}
      <option value="{{ voice.id }}"{% if filter_voice and filter_voice.id == voice.id %} selected{% endif %}>{{ voice.name }}</option>
      {% endfor %}
    </optgroup>
    {% endfor %}
  </select>
  {% if filter_voice %}
  <span class="home-filter-note">Stats below cover only channels under
    <strong>{{ filter_voice.group.name }}: {{ filter_voice.name }}</strong>.</span>
  {% endif %}
  <noscript><button type="submit" class="search-btn">Apply</button></noscript>
</form>
{% endif %}
